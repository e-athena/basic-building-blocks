<!DOCTYPE html>
<html LANG="zh-CN">
<head>
    <title>登录</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            margin: 100px auto;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            color: #ff0000;
            font-size: 16px;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #666;
            font-size: 16px;
            margin-bottom: 5px;
            text-align: left;
        }

        input {
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 16px;
            padding: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: #4CAF50;
            border: none;
            border-radius: 3px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>登录系统</h1>
    <form method="post">
        <label for="username">用户名:</label>
        <input type="text" id="username" name="username" placeholder="请输入" required>
        <label for="password">密码:</label>
        <input type="password" id="password" name="password" placeholder="请输入" required>
        <button type="submit">登录</button>
    </form>
</div>
</body>
</html>
